name: drink_timmer_app
description: A water drinking reminder app with BLoC and local notifications
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  
  # Local Notifications
  #flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  flutter_local_notifications: ^17.2.3
  flutter_launcher_icons: ^0.13.1 
  
  # Calendar
  table_calendar: ^3.0.9
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Utilities
  intl: ^0.18.1
  
  # Routing
  go_router: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  #assets:
  #  - assets/png/app_logo.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/png/app_logo.png"  